services:
  frontend:
    build:
      context: ./client
    ports:
      - "3000:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./server
    ports:
      - "8000:5000"
    environment:
      PORT: 5000
      MONGO_URL: mongodb://mongo:27017/mern-demo
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:

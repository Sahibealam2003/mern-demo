services:
  # ─── MongoDB ──────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: todo-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    networks:
      - todo-net

  # ─── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: todo-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - todo-net

  # ─── Backend API ──────────────────────────────────────────────────────────────
  server:
    build: ./server
    container_name: todo-server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      # Override host-based URLs so containers talk over the Docker network.
      # Remove MONGO_URI / REDIS_URL here to keep whatever is in server/.env
      # (e.g. Mongo Atlas) instead of the local containers below.
      - MONGO_URI=mongodb://mongo:27017/Todo
      - REDIS_URL=redis://redis:6379
      - CLIENT_URL=http://localhost:8080
    depends_on:
      - mongo
      - redis
    ports:
      - "5000:5000"
    networks:
      - todo-net

  # ─── Frontend (nginx) ─────────────────────────────────────────────────────────
  client:
    build: ./client
    container_name: todo-client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "8080:80"
    networks:
      - todo-net

networks:
  todo-net:
    driver: bridge

volumes:
  mongo-data:
  redis-data:

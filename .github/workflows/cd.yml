name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  push-images:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR rejects uppercase image names; the owner "Sahibealam2003" has one.
      - name: Compute image prefix
        id: img
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # -------- Server --------
      - name: Server image metadata
        id: meta-server
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.prefix }}-server
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push server
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: ${{ steps.meta-server.outputs.tags }}
          labels: ${{ steps.meta-server.outputs.labels }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max

      # -------- Client --------
      - name: Client image metadata
        id: meta-client
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.prefix }}-client
          tags: |
            type=raw,value=latest
            type=sha,format=long

      # .dockerignore excludes .env, so these must be injected at build time or
      # the bundle falls back to http://localhost:5000 and the deploy is dead.
      - name: Build and push client
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          tags: ${{ steps.meta-client.outputs.tags }}
          labels: ${{ steps.meta-client.outputs.labels }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_SOCKET_URL=${{ vars.VITE_SOCKET_URL }}
          cache-from: type=gha,scope=client
          cache-to: type=gha,scope=client,mode=max

      - name: Summary
        run: |
          {
            echo "### Images pushed"
            echo ""
            echo '```'
            echo "${{ steps.meta-server.outputs.tags }}"
            echo "${{ steps.meta-client.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

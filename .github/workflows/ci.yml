name: CI Pipeline

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
jobs:
    client:
        name: Client CI
        runs-on: ubuntu-latest
        defaults:
            run:
              working-directory: client
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Setup Node.js 
              uses: actions/setup-node@v4
              with:
                node-version: 22
                cache: npm
                cache-dependency-path: client/package-lock.json

            - name: Install Dependencie
              run: npm ci 

            - name: Run Lint
              run: npm run lint

            - name: Build Client
              run: npm run build 

    server:
        name: Server CI
        runs-on: ubuntu-latest
        defaults:
             run:
              working-directory: server
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 22
                cache: npm
                cache-dependency-path: server/package-lock.json
            
            - name: Install Dependencies
              run: npm ci
            
            - name: Build Backend
              run: npm run build --if-present
            
            - name: Run Tests
              run: npm test --if-present
             




                  

                